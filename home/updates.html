<!doctype html>
<html>
	<head>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
		<script src="/scripts/route.js"></script>
		<link href="/style.css" rel="stylesheet" type="text/css">
		<title>Smoketopus' Home of Robots and Creatures - Home!</title>
	</head>
	<body>
    <main>
      <header></header>
      <nav></nav>
      <div class="content-wrap flex alignment">
        <aside>
        </aside>
        <article>
          <h1>Site Updates</h1>
          <style>
					.news-item img{
						max-width: 40%;
					}
				</style>
          <div id="update-Item">
            
            <script>
					    async function fetchRSS() {
        const fetchUrl = "https://smoketopus.art/rss.xml";
        
        try {
            console.log('Fetching URL:', fetchUrl); // Debugging 1: Log the request URL
            const response = await fetch(fetchUrl);
            const data = await response.text();
            
            console.log('Data fetched:', data); // Debugging 2: Log the raw data
            
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(data, "application/xml");

            console.log('Parsed XML:', xmlDoc); // Debugging 3: Log the parsed XML

            let items = xmlDoc.querySelectorAll("item");
            const scrollContainer = document.getElementById('update-Item');
            scrollContainer.innerHTML = '';

            for(var i = items.length-1; i >=0; i--){
                const title = items[i].querySelector("title").textContent;
                const link = items[i].querySelector("link").textContent;
                const description = items[i].querySelector("description").textContent;
                let pubDate = items[i].querySelector("pubDate").textContent;

                const newsItem = document.createElement('div');
                newsItem.classList.add('news-item');
                newsItem.innerHTML = `
                    <h3><a href="${link}" target="_blank">${title}</a></h3>
                    <p>${description}</p>
                    <small>${pubDate}</small>
                `;

                scrollContainer.appendChild(newsItem);
            }
			

                
        } catch (error) {
            console.error('Error fetching the RSS feed:', error);
        }
    }

    document.addEventListener('DOMContentLoaded', fetchRSS);
				</script>
          </div>
        </article>
      </div>
    </main>
  </body>
</html>
