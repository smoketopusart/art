				<script>
					    async function fetchRSS() {
        const fetchUrl = "https://smoketopus.art/rss.xml";
        
        try {
            console.log('Fetching URL:', fetchUrl); // Debugging 1: Log the request URL
            const response = await fetch(fetchUrl);
            const data = await response.text();
            
            console.log('Data fetched:', data); // Debugging 2: Log the raw data
            
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(data, "application/xml");

            console.log('Parsed XML:', xmlDoc); // Debugging 3: Log the parsed XML

            let items = xmlDoc.querySelectorAll("item");
            const scrollContainer = document.getElementById('update-Item');
            scrollContainer.innerHTML = '';

			

                const title = items[items.length-1].querySelector("title").textContent;
                const link = items[items.length-1].querySelector("link").textContent;
                const description = items[items.length-1].querySelector("description").textContent;
                let pubDate = items[items.length-1].querySelector("pubDate").textContent;

                const newsItem = document.createElement('div');
                newsItem.classList.add('news-item');
                newsItem.innerHTML = `
                    <h3><a href="${link}" target="_blank">${title}</a></h3>
                    <p>${description}</p>
                    <small>${pubDate}</small>
                `;

                scrollContainer.appendChild(newsItem);
        } catch (error) {
            console.error('Error fetching the RSS feed:', error);
        }
    }

    document.addEventListener('DOMContentLoaded', fetchRSS);
				</script>
